[project]
name = "eval-harness"
version = "0.1.0"
description = "Config-driven LLM evaluation harness for the insurance LLM benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "click>=8.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
audit = [
  "inspect-ai>=0.3",
  "inspect-petri",
  "anthropic>=0.40",
]
tau2 = [
    "tau2",
    "websockets>=17.2",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"
ai-risk-audit = "ai_risk_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness", "ai_risk_audit"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tau2 = { path = "../tau2-bench", editable = true }
