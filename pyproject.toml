[project]
name = "eval-harness"
version = "0.1.0"
description = "Config-driven LLM evaluation harness for the insurance LLM benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "click>=8.1",
  "matplotlib>=3.9",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
