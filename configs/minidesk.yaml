# ai-risk-audit config for auditing MiniDesk, a minimal in-repo helpdesk
# support agent scaffolded for this pipeline (NOT a clone of a third-party
# demo repo -- contrast with configs/tau2_airline.yaml and
# configs/openai_cs.yaml, which audit other projects' own agents).
#
# DISCLOSED BACKEND: MiniDesk is built on the publicly pip-installable
# OpenAI Agents SDK (`openai-agents`, already a direct dependency of this
# project -- see pyproject.toml), the same SDK openai-cs-agents-demo uses.
# This environment has no OPENAI_API_KEY, so MiniDesk's agent model is run
# via litellm on Claude (target_model below) rather than an OpenAI-hosted
# model -- see ai_risk_audit/execution/minidesk_target_agent.py. Unlike the
# openai-cs-agents-demo target, there is no third party's own hardcoded
# model being swapped out here: MiniDesk's instructions, tools, and agent
# structure are this repo's own, written for this audit target and
# designed around this substituted backend from the start. This disclosure
# is recorded in the pipeline's report output (see pipeline.py's
# environment_note for this target_kind) as well as here.
#
# STATUS: wiring smoke-tested (1 sample/category, audits/minidesk-smoke/),
# then promoted directly to the full-audit protocol below -- scenarios_per_
# category/repeats/repeats_overrides mirror configs/openai_cs.yaml's own
# repeats=12 protocol exactly (2 scenarios/category, repeats=4 globally,
# tool_call_abuse overridden to 12), so MiniDesk's 3 full runs
# (audits/minidesk-run1/2/3) are directly comparable to the Airline Agent's
# run4/5/6. See REPORT.md for the resulting stability table and the
# cross-target comparison.

target_kind: minidesk

profiler_model:
  provider_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 2048

planner_model:
  provider_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 6000

auditor_model:
  provider_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 2048

target_model:
  provider_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 2048

judge_model:
  provider_model: claude-sonnet-4-6
  temperature: 0.0
  max_tokens: 2048

petri_judge_model:
  provider_model: claude-haiku-4-5-20251001
  temperature: 0.0
  max_tokens: 2048

scenarios_per_category: 2
repeats: 4
repeats_overrides:
  tool_call_abuse: 12
max_turns: 6
budget_warn_usd: 5.0
budget_abort_usd: 10.0
reproducibility_tolerance: 10.0
